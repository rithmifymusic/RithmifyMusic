<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rythmify</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="ambient"><i></i><i></i><i></i></div>
<div id="app">
  <header id="topbar">
    <div class="logo"><button class="round small" id="btn-fx" title="Učinki in nastavitve zvoka"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 7h10V5h2v2h4v2h-4v2h-2V9H4zm0 8h4v-2h2v2h10v2H10v2H8v-2H4z"/></svg></button><span class="brand-whole" role="img" aria-label="Rythmify"></span></div>
    <div id="fxmenu" hidden></div>
    <div id="top-center">
      <button class="round" id="btn-home" title="Domov">⌂</button>
      <div id="searchbox"><span>⌕</span><input id="q" type="text" placeholder="Kaj želiš poslušati?"></div>
    </div>
    <div id="top-right">
      <button id="avatar-btn" title="Profil"></button>
      <div id="menu" hidden></div>
    </div>
  </header>
  <nav id="sidebar"></nav>
  <main id="content"></main>
  <aside id="side-panel" hidden></aside>
  <footer id="player">
    <div id="now">
      <img id="now-cover" alt="">
      <div style="min-width:0">
        <div id="now-title">Nič se ne predvaja</div>
        <div id="now-artist"></div>
      </div>
      <button id="btn-like" title="Všeček"></button>
      <button id="btn-addpl" title="Dodaj v miks / seznam"></button>
    </div>
    <div id="controls">
      <div class="crow">
        <button id="btn-shuffle" title="Naključno"></button>
        <button id="btn-prev" title="Prejšnja"></button>
        <button id="btn-play" title="Predvajaj/pavza"></button>
        <button id="btn-next" title="Naslednja"></button>
        <button id="btn-repeat" title="Ponovi"></button>
      </div>
      <div class="crow">
        <span id="pos">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="dur">0:00</span>
      </div>
    </div>
    <div id="extras">
      <button id="btn-viz" title="Vizualizator"></button>
      <button id="btn-lyrics" title="Predvaja se / besedilo"></button>
      <button id="btn-queue" title="Čakalna vrsta"></button>
      <input id="volume" type="range" min="0" max="100" value="80" title="Glasnost">
      <button id="btn-mini" title="Mini predvajalnik"></button>
      <button id="btn-full" title="Celoten zaslon (F11)"></button>
      <button id="btn-theater" title="Video čez vsebino"></button>
    </div>
  </footer>
</div>
<audio id="audio" preload="auto"></audio>
<div id="auth" hidden></div>
<div id="yt-wrap"><div class="ytslot"><div id="yt"></div></div><div class="ytslot"><div id="yt2"></div></div></div>
<script src="/vendor/socket.io.js"></script>
<script src="gmajna.js"></script>
</body>
</html>
